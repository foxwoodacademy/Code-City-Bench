<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmic Breakout</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        body {
            background-color: #0d0d1e;
            color: #ffffff;
            font-family: 'Press Start 2P', cursive;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
        }
        .game-container {
            position: relative;
            background-color: #000;
            border: 4px solid #fff;
            box-shadow: 0 0 20px #0ff, 0 0 40px #0ff;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1rem;
            max-width: 90vw;
            max-height: 90vh;
            aspect-ratio: 4 / 3;
        }
        #gameCanvas {
            background-color: #000;
            display: block;
            width: 100%;
            height: 100%;
        }
        .ui-panel {
            display: flex;
            justify-content: space-between;
            width: 100%;
            padding: 0.5rem;
            box-sizing: border-box;
            background-color: rgba(0, 0, 0, 0.5);
            border-bottom: 2px solid #0ff;
            text-shadow: 0 0 5px #fff;
            margin-bottom: 0.5rem;
        }
        .message-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #fff;
            box-shadow: 0 0 10px #0ff;
            padding: 2rem;
            text-align: center;
            border-radius: 8px;
            max-width: 80%;
        }
        .btn {
            background-color: #0ff;
            color: #000;
            font-family: 'Press Start 2P', cursive;
            border: none;
            border-radius: 6px;
            padding: 0.75rem 1.5rem;
            font-size: 0.8rem;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 0 8px #0ff;
            transition: all 0.2s ease-in-out;
            margin-top: 1rem;
        }
        .btn:hover {
            background-color: #fff;
            color: #000;
            box-shadow: 0 0 15px #fff;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="ui-panel">
            <span>Score: <span id="scoreDisplay">0</span></span>
            <span>Lives: <span id="livesDisplay">3</span></span>
        </div>
        <canvas id="gameCanvas"></canvas>
        
        <!-- Game message box -->
        <div id="messageBox" class="message-box" style="display: none;">
            <h2 class="text-2xl mb-4" id="messageTitle">Cosmic Breakout</h2>
            <p id="messageText">Use ← → to move the paddle.</p>
            <button id="playBtn" class="btn">Play</button>
        </div>
    </div>

    <script>
        window.onload = function() {
            // Get the canvas and its 2D context
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            
            // Get UI elements
            const scoreDisplay = document.getElementById('scoreDisplay');
            const livesDisplay = document.getElementById('livesDisplay');
            const messageBox = document.getElementById('messageBox');
            const messageTitle = document.getElementById('messageTitle');
            const messageText = document.getElementById('messageText');
            const playBtn = document.getElementById('playBtn');

            // Game variables
            let gameStarted = false;
            let gameOver = false;
            let score = 0;
            let lives = 3;

            // Paddle variables
            let paddleWidth;
            let paddleHeight;
            let paddleX;
            const paddleSpeed = 7;
            
            // Ball variables
            let ballRadius;
            let ballX;
            let ballY;
            let ballDx;
            let ballDy;

            // Brick variables
            const brickRows = 6;
            const brickCols = 8;
            let brickWidth;
            const brickHeight = 20;
            const brickPadding = 10;
            const brickOffsetTop = 30;
            const brickOffsetLeft = 30;
            let bricks = [];

            let keys = {};

            // Function to show the message box
            function showMessage(title, text, buttonText) {
                messageTitle.textContent = title;
                messageText.textContent = text;
                playBtn.textContent = buttonText;
                messageBox.style.display = 'block';
            }

            // Function to initialize all game variables
            function initGame() {
                // Set canvas size dynamically
                const container = canvas.parentElement;
                canvas.width = container.clientWidth;
                canvas.height = container.clientHeight;

                // Paddle
                paddleWidth = canvas.width / 8;
                paddleHeight = 15;
                paddleX = (canvas.width - paddleWidth) / 2;
                
                // Ball
                ballRadius = 10;
                resetBall();
                
                // Bricks
                brickWidth = (canvas.width - (brickCols - 1) * brickPadding - 2 * brickOffsetLeft) / brickCols;
                bricks = [];
                for (let r = 0; r < brickRows; r++) {
                    bricks[r] = [];
                    for (let c = 0; c < brickCols; c++) {
                        bricks[r][c] = { x: 0, y: 0, status: 1 };
                    }
                }

                score = 0;
                lives = 3;
                scoreDisplay.textContent = score;
                livesDisplay.textContent = lives;
                gameOver = false;
                gameStarted = false;
            }

            // Reset ball position and velocity
            function resetBall() {
                ballX = canvas.width / 2;
                ballY = canvas.height - paddleHeight - ballRadius - 5;
                ballDx = (Math.random() > 0.5 ? 1 : -1) * (Math.random() * 2 + 2); // Random horizontal speed
                ballDy = -3;
            }

            // Draw functions
            function drawPaddle() {
                ctx.fillStyle = '#0ff';
                ctx.shadowColor = '#0ff';
                ctx.shadowBlur = 10;
                ctx.fillRect(paddleX, canvas.height - paddleHeight, paddleWidth, paddleHeight);
                ctx.shadowBlur = 0;
            }

            function drawBall() {
                ctx.beginPath();
                ctx.arc(ballX, ballY, ballRadius, 0, Math.PI * 2);
                ctx.fillStyle = '#fff';
                ctx.shadowColor = '#fff';
                ctx.shadowBlur = 10;
                ctx.fill();
                ctx.closePath();
                ctx.shadowBlur = 0;
            }

            function drawBricks() {
                for (let r = 0; r < brickRows; r++) {
                    for (let c = 0; c < brickCols; c++) {
                        const b = bricks[r][c];
                        if (b.status === 1) {
                            const brickX = (c * (brickWidth + brickPadding)) + brickOffsetLeft;
                            const brickY = (r * (brickHeight + brickPadding)) + brickOffsetTop;
                            b.x = brickX;
                            b.y = brickY;
                            
                            // Use a different color for each row
                            const color = ['#f00', '#f90', '#ff0', '#0f0', '#0ff', '#00f'][r];
                            ctx.fillStyle = color;
                            ctx.shadowColor = color;
                            ctx.shadowBlur = 8;
                            ctx.fillRect(brickX, brickY, brickWidth, brickHeight);
                            ctx.shadowBlur = 0;
                        }
                    }
                }
            }

            // Game logic
            function updatePaddle() {
                if (keys['ArrowLeft'] && paddleX > 0) {
                    paddleX -= paddleSpeed;
                }
                if (keys['ArrowRight'] && paddleX < canvas.width - paddleWidth) {
                    paddleX += paddleSpeed;
                }
            }

            function updateBall() {
                ballX += ballDx;
                ballY += ballDy;

                // Wall collision (left, right, top)
                if (ballX + ballDx > canvas.width - ballRadius || ballX + ballDx < ballRadius) {
                    ballDx = -ballDx;
                }
                if (ballY + ballDy < ballRadius) {
                    ballDy = -ballDy;
                }

                // Paddle collision
                if (ballY + ballDy > canvas.height - ballRadius - paddleHeight) {
                    if (ballX > paddleX && ballX < paddleX + paddleWidth) {
                        ballDy = -ballDy;
                        // Add some spin based on where the ball hits the paddle
                        const relativeIntersectX = ballX - (paddleX + paddleWidth / 2);
                        ballDx = relativeIntersectX * 0.1;
                    } else if (ballY + ballDy > canvas.height - ballRadius) {
                        // Ball missed the paddle
                        lives--;
                        livesDisplay.textContent = lives;
                        if (lives <= 0) {
                            endGame(false);
                        } else {
                            resetBall();
                        }
                    }
                }
            }

            function checkBrickCollisions() {
                for (let r = 0; r < brickRows; r++) {
                    for (let c = 0; c < brickCols; c++) {
                        const b = bricks[r][c];
                        if (b.status === 1) {
                            if (ballX > b.x && ballX < b.x + brickWidth && ballY > b.y && ballY < b.y + brickHeight) {
                                ballDy = -ballDy;
                                b.status = 0;
                                score++;
                                scoreDisplay.textContent = score;
                                if (score === brickRows * brickCols) {
                                    endGame(true);
                                }
                            }
                        }
                    }
                }
            }

            function endGame(win) {
                gameOver = true;
                if (win) {
                    showMessage("You Win!", "Congratulations, you cleared the cosmic field!", "Play Again");
                } else {
                    showMessage("Game Over", `Your final score is ${score}.`, "Try Again");
                }
            }

            function resetGame() {
                messageBox.style.display = 'none';
                initGame();
                gameStarted = true;
                gameLoop();
            }

            // Main game loop
            function gameLoop() {
                if (gameOver || !gameStarted) {
                    return;
                }
                
                // Clear the canvas
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                // Draw game objects
                drawBricks();
                drawPaddle();
                drawBall();
                
                // Update game objects
                updatePaddle();
                updateBall();
                checkBrickCollisions();
                
                requestAnimationFrame(gameLoop);
            }

            // Event listeners for user input
            document.addEventListener('keydown', (e) => {
                keys[e.key] = true;
            });
            document.addEventListener('keyup', (e) => {
                keys[e.key] = false;
            });
            
            // Handle window resize
            window.addEventListener('resize', initGame);

            // Button listener
            playBtn.addEventListener('click', resetGame);
            
            // Initial setup
            initGame();
            showMessage("Cosmic Breakout", "Use the left and right arrow keys to move the paddle and break all the bricks!", "Start Game");
        };
    </script>
</body>
</html>
