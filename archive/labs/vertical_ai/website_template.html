<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{Business Name}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            color: #333;
        }
        header {
            background: #4CAF50;
            color: white;
            padding: 1rem 0;
            text-align: center;
        }
        nav {
            display: flex;
            justify-content: center;
            background: #333;
        }
        nav a {
            color: white;
            padding: 1rem;
            text-decoration: none;
        }
        nav a:hover {
            background: #ddd;
            color: black;
        }
        .container {
            padding: 2rem;
        }
        footer {
            text-align: center;
            padding: 1rem 0;
            background: #333;
            color: white;
        }
        .chatbot-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 300px;
            height: 400px;
            border: 1px solid #ccc;
            border-radius: 5px;
            display: none;
        }
        .chatbot-header {
            background: #4CAF50;
            color: white;
            padding: 10px;
            border-top-left-radius: 5px;
            border-top-right-radius: 5px;
        }
        .chatbot-messages {
            height: 300px;
            overflow-y: scroll;
            padding: 10px;
        }
        .chatbot-input {
            display: flex;
            padding: 10px;
        }
        .chatbot-input input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .chatbot-input button {
            padding: 10px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <header>
        <h1>{Business Name}</h1>
        <p>{Business Tagline}</p>
    </header>
    <nav>
        <a href="#">Home</a>
        <a href="#">Services</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>
    <div class="container">
        <h2>Welcome to {Business Name}</h2>
        <p>{Business Description}</p>
        <div id="chatbot" class="chatbot-container">
            <div class="chatbot-header">
                <h3>Chat with Us</h3>
            </div>
            <div class="chatbot-messages" id="chatbot-messages">
                <!-- Messages will appear here -->
            </div>
            <div class="chatbot-input">
                <input type="text" id="chatbot-input" placeholder="Type your message...">
                <button id="chatbot-send">Send</button>
            </div>
        </div>
    </div>
    <footer>
        <p>&copy; 2023 {Business Name}. All rights reserved.</p>
    </footer>
    <script>
        // Simple chatbot functionality
        document.getElementById('chatbot-send').addEventListener('click', function() {
            const input = document.getElementById('chatbot-input');
            const message = input.value;
            if (message.trim() !== '') {
                const messages = document.getElementById('chatbot-messages');
                messages.innerHTML += `<p><strong>You:</strong> ${message}</p>`;
                input.value = '';
                // Simulate AI response
                setTimeout(function() {
                    messages.innerHTML += `<p><strong>AI:</strong> Thank you for your message! We'll get back to you soon.</p>`;
                    messages.scrollTop = messages.scrollHeight;
                }, 1000);
            }
        });
    </script>
</body>
</html>
