<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Veritas AI Report</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 2em;
            line-height: 1.6;
        }
        h1, h2 {
            color: #003366;
        }
        .section {
            margin-bottom: 2em;
        }
        .highlight {
            background-color: #ffeeba;
            padding: 0.5em;
            border-radius: 5px;
        }
        .footer {
            font-size: 0.8em;
            color: #666;
            border-top: 1px solid #ccc;
            padding-top: 1em;
            margin-top: 2em;
        }
    </style>
</head>
<body>
    <h1>Veritas AI: Analysis Report</h1>

    <div class="section">
        <h2>Summary</h2>
        <p>{{ data.summary }}</p>
    </div>

    <div class="section">
        <h2>Entities & Red Flags</h2>
        <ul>
            {% for item in data.entities %}
                <li><strong>{{ item.name }}</strong>: {{ item.issue }}</li>
            {% endfor %}
        </ul>
    </div>

    <div class="section">
        <h2>Recommendations</h2>
        <p>{{ data.recommendations }}</p>
    </div>

    <div class="footer">
        Report generated by Veritas AI on {{ data.generated_at }}
    </div>
</body>
</html>
